apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-microservice
  labels:
    app: node-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-microservice
  template:
    metadata:
      labels:
        app: node-microservice
    spec:
      containers:
        - name: node-microservice
          # Replace with your Artifact Registry image path (set by the README steps)
          image: REGION-docker.pkg.dev/PROJECT_ID/node-microservice-repo/node-microservice:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
